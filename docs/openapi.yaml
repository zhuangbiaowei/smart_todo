openapi: 3.1.0
info:
  title: SmartTodo HTTP API
  version: 0.1.0
  summary: Task orchestration API for multi-agent and AI coding workflows
  description: |
    SmartTodo provides hierarchical task management, dependency tracking,
    multi-agent assignment, execution reporting, and query filters for
    AI coding tools.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:4567
    description: Local development server
tags:
  - name: Tasks
    description: Create, update, query, seek, and report tasks
  - name: Subtasks
    description: Manage direct subtasks under a parent task
paths:
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Returns tasks ordered by descending priority and ascending creation time.
        Supports filtering by runtime status, task type, parent, executor,
        completion status, required skill, and suggested tool.
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/task_type'
        - $ref: '#/components/parameters/parent_id'
        - $ref: '#/components/parameters/actual_executor'
        - $ref: '#/components/parameters/completion_status'
        - $ref: '#/components/parameters/required_skill'
        - $ref: '#/components/parameters/suggested_tool'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              examples:
                default:
                  value:
                    - id: 7ec80824-0fca-4ddb-9aa3-abfdb7f463b1
                      title: Implement API
                      description: Build payment API
                      status: pending
                      parent_id: null
                      priority: 10
                      task_type: simple
                      requirements:
                        suggested_tools: [terminal, editor]
                        skill_instructions: [Write tests first]
                      acceptance_criteria: [All tests pass]
                      success_criteria: [HTTP 200 contract matches spec]
                      failure_criteria: [Contract broken]
                      required_skills: [ruby, backend]
                      metadata:
                        sprint: S1
                      created_at: '2026-03-09T08:00:00Z'
                      updated_at: '2026-03-09T08:00:00Z'
                      actual_executor: null
                      completion_status: null
                      task_result: null
                      execution_logs: []
                      dependencies: []
                      children: []
                      assignments: []
                      reports: []
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
            examples:
              default:
                value:
                  title: Implement payment module
                  description: Support multiple channels
                  task_type: parallel
                  dependencies: []
                  required_skills: [ruby, payments]
                  requirements:
                    suggested_tools: [terminal, browser]
                    skill_instructions:
                      - Read payment protocol first
                      - Implement callback handling
                  acceptance_criteria: [Integration tests pass]
                  success_criteria: [Payment and refund flows work]
                  failure_criteria: [Reconciliation fails]
                  priority: 8
                  metadata:
                    sprint: S1
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/seek:
    post:
      tags: [Tasks]
      summary: Seek executable tasks for an agent
      description: |
        Returns pending tasks whose dependencies are completed and whose
        required skills are all included in the agent skills.
        Each returned task is also recorded as an assignment.
      operationId: seekTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeekTasksInput'
      responses:
        '200':
          description: Matching tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Fetch a task
      operationId: fetchTask
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Tasks]
      summary: Update or reshape a task
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/report:
    post:
      tags: [Tasks]
      summary: Report task execution result
      operationId: reportTask
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReportInput'
            examples:
              success:
                value:
                  agent_id: agent-ml-1
                  result: success
                  summary: Tests passed
                  detail:
                    coverage: 0.91
                  completion_status: accepted
                  task_result:
                    summary: Payment flow implemented
                    artifacts:
                      - lib/payments/service.rb
                      - test/payments_test.rb
                    metrics:
                      coverage: 0.91
                  execution_logs:
                    - Run unit tests
                    - Run integration tests
      responses:
        '200':
          description: Updated task after report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/subtasks:
    get:
      tags: [Subtasks]
      summary: List direct subtasks
      operationId: listSubtasks
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Direct subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Subtasks]
      summary: Create direct subtasks under a parent task
      operationId: createSubtasks
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskCreateRequest'
      responses:
        '201':
          description: Created subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/subtasks/{subtaskId}:
    patch:
      tags: [Subtasks]
      summary: Update a direct subtask
      operationId: updateSubtask
      parameters:
        - $ref: '#/components/parameters/taskId'
        - $ref: '#/components/parameters/subtaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Updated subtask
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Subtasks]
      summary: Delete a direct subtask
      operationId: deleteSubtask
      parameters:
        - $ref: '#/components/parameters/taskId'
        - $ref: '#/components/parameters/subtaskId'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubtaskResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      description: Task ID
    subtaskId:
      name: subtaskId
      in: path
      required: true
      schema:
        type: string
      description: Subtask ID
    status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TaskStatus'
      description: Filter by runtime task status
    task_type:
      name: task_type
      in: query
      schema:
        $ref: '#/components/schemas/TaskType'
      description: Filter by task type
    parent_id:
      name: parent_id
      in: query
      schema:
        type: string
      description: Filter by parent task ID. Use `root` for top-level tasks.
    actual_executor:
      name: actual_executor
      in: query
      schema:
        type: string
      description: Filter by actual executor agent ID
    completion_status:
      name: completion_status
      in: query
      schema:
        type: string
      description: Filter by business completion status
    required_skill:
      name: required_skill
      in: query
      schema:
        type: string
      description: Filter tasks whose required_skills contain this value
    suggested_tool:
      name: suggested_tool
      in: query
      schema:
        type: string
      description: Filter tasks whose requirements.suggested_tools contain this value
  responses:
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error: task not-exists not found
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTaskType:
              value:
                error: "task_type must be one of: simple, sequential, parallel, recurring, branching"
  schemas:
    TaskType:
      type: string
      enum:
        - simple
        - sequential
        - parallel
        - recurring
        - branching
    TaskStatus:
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - failed
        - suspended
        - blocked
    TaskReportResult:
      type: string
      enum:
        - success
        - failed
        - suspended
        - blocked
        - in_progress
    Requirements:
      type: object
      additionalProperties: true
      properties:
        suggested_tools:
          type: array
          items:
            type: string
        skill_instructions:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
      description: Recommended tools and operational guidance for AI agents
    TaskResult:
      type:
        - object
        - 'null'
      additionalProperties: true
      properties:
        summary:
          type: string
        artifacts:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties: true
        next_actions:
          type: array
          items:
            type: string
      description: Structured execution result payload
    Assignment:
      type: object
      additionalProperties: true
      required:
        - agent_id
        - assigned_at
      properties:
        agent_id:
          type: string
        assigned_at:
          type: string
          format: date-time
        agent_skills:
          type: array
          items:
            type: string
    Report:
      type: object
      additionalProperties: true
      required:
        - agent_id
        - result
        - detail
        - reported_at
      properties:
        agent_id:
          type: string
        result:
          type: string
        summary:
          type:
            - string
            - 'null'
        detail:
          type: object
          additionalProperties: true
        reported_at:
          type: string
          format: date-time
    Task:
      $ref: ./schemas/task.schema.json
    TaskCreateInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
        parent_id:
          type: string
        parent_task_id:
          type: string
          description: Alias of parent_id, supported by the HTTP API
        dependencies:
          type: array
          items:
            type: string
          default: []
        task_type:
          $ref: '#/components/schemas/TaskType'
        requirements:
          $ref: '#/components/schemas/Requirements'
        acceptance_criteria:
          type: array
          items:
            type: string
          default: []
        success_criteria:
          type: array
          items:
            type: string
          default: []
        failure_criteria:
          type: array
          items:
            type: string
          default: []
        required_skills:
          type: array
          items:
            type: string
          default: []
        priority:
          type: integer
          default: 0
        metadata:
          type: object
          additionalProperties: true
          default: {}
    TaskUpdateFields:
      type: object
      additionalProperties: true
      properties:
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/TaskStatus'
        parent_id:
          type:
            - string
            - 'null'
        priority:
          type: integer
        task_type:
          $ref: '#/components/schemas/TaskType'
        requirements:
          $ref: '#/components/schemas/Requirements'
        acceptance_criteria:
          type: array
          items:
            type: string
        success_criteria:
          type: array
          items:
            type: string
        failure_criteria:
          type: array
          items:
            type: string
        required_skills:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        completion_status:
          type:
            - string
            - 'null'
        task_result:
          $ref: '#/components/schemas/TaskResult'
        execution_logs:
          type: array
          items:
            type: string
        actual_executor:
          type:
            - string
            - 'null'
      description: |
        Fields written directly into the task node. The service validates
        parent existence and task_type. Setting status=completed is rejected
        when direct children are not all completed.
    TaskUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        updates:
          $ref: '#/components/schemas/TaskUpdateFields'
        add_dependencies:
          type: array
          items:
            type: string
          default: []
        remove_dependencies:
          type: array
          items:
            type: string
          default: []
    SeekTasksInput:
      type: object
      additionalProperties: false
      required:
        - agent_id
      properties:
        agent_id:
          type: string
        skills:
          type: array
          items:
            type: string
          default: []
        limit:
          type: integer
          minimum: 1
          default: 1
    TaskReportInput:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - result
      properties:
        agent_id:
          type: string
        result:
          $ref: '#/components/schemas/TaskReportResult'
        summary:
          type:
            - string
            - 'null'
        detail:
          type: object
          additionalProperties: true
          default: {}
        completion_status:
          type:
            - string
            - 'null'
        task_result:
          $ref: '#/components/schemas/TaskResult'
        execution_logs:
          type: array
          items:
            type: string
    SubtaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        - subtasks
      properties:
        subtasks:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/TaskCreateInput'
              - type: object
                required:
                  - title
    DeleteSubtaskResponse:
      type: object
      additionalProperties: false
      required:
        - deleted_task_id
        - parent_task_id
      properties:
        deleted_task_id:
          type: string
        parent_task_id:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
